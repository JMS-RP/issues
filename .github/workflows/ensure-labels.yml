name: Ensure issue labels

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "type: bug", color: "D73A4A", description: "A confirmed or reported defect" },
              { name: "type: suggestion", color: "A2EEEF", description: "A feature request or improvement idea" },
              { name: "type: question", color: "D876E3", description: "A public question or help request" },
              { name: "type: documentation", color: "0075CA", description: "Documentation or wording issue" },
              { name: "status: triage", color: "FBCA04", description: "Awaiting initial review" },
              { name: "status: confirmed", color: "0E8A16", description: "Reproduced or accepted for investigation" },
              { name: "status: needs info", color: "C5DEF5", description: "More information is required" },
              { name: "status: in progress", color: "1D76DB", description: "Actively being worked on" },
              { name: "priority: high", color: "B60205", description: "Requires elevated attention" },
              { name: "priority: low", color: "EDEDED", description: "Useful but non-urgent" },
              { name: "area: police", color: "5319E7", description: "Police systems" },
              { name: "area: garages", color: "5319E7", description: "Garage and vehicle storage systems" },
              { name: "area: phone", color: "5319E7", description: "Phone and communications systems" },
              { name: "area: radio", color: "5319E7", description: "Radio systems" },
              { name: "area: ui", color: "5319E7", description: "UI/NUI and usability" },
              { name: "area: inventory", color: "5319E7", description: "Inventory and clothing systems" },
              { name: "area: fishing", color: "5319E7", description: "Fishing systems" },
              { name: "area: levelling", color: "5319E7", description: "Levelling and progression systems" },
              { name: "area: jobs", color: "5319E7", description: "Jobs and professions" },
              { name: "area: admin", color: "5319E7", description: "Staff and administration systems" },
              { name: "area: other", color: "5319E7", description: "Other JMS RP systems" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }